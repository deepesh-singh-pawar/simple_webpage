# Apply once on the cluster where Argo CD runs:
#   kubectl apply -n argocd -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-webpage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/deepesh-singh-pawar/simple_webpage.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
